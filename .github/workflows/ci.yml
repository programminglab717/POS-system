name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Property tests run 256 cases locally; CI runs more.
  PROPTEST_CASES: "4096"

jobs:
  rust:
    name: Rust kernel
    runs-on: ubuntu-latest
    # Two full test passes, each with 4,096 cases a property and the simulator's seeds, take
    # about fifty minutes when the kernel changes; the limit only stops a run that hangs.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Planted bugs' texts are still in the code
        run: |
          for list in tools/planted-bugs/keel-*.py; do
            python3 tools/planted-bugs/run.py "$(basename "$list" .py)" --stale
          done

      - name: Lint (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Lint (no default features, as on wasm32)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Test, including exhaustive sweeps
        run: cargo test --workspace --all-features -- --include-ignored

      - name: Test without default features
        run: cargo test --workspace --no-default-features
        env:
          # The simulator's seeds from 1000: other runs than the step above.
          KEEL_SIM_FIRST_SEED: "1000"

      - name: Documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build for wasm32
        run: cargo build -p keel-types -p keel-events -p keel-domain -p keel-pricing -p keel-doc --no-default-features --target wasm32-unknown-unknown

      - name: Generated currency table matches the ISO 4217 snapshot
        run: |
          python3 core/crates/keel-types/tools/gen_currency_table.py
          git diff --exit-code -- core/crates/keel-types/src/currency/table.rs

      - name: Generated locale table matches the CLDR snapshot
        run: |
          python3 core/crates/keel-types/tools/gen_locale_table.py
          git diff --exit-code -- core/crates/keel-types/src/locale/table.rs

      # Node.js 22.22's ICU 78.2 has CLDR 48, the release of keel-types' snapshot.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Amounts and quantities show as ICU shows them
        run: |
          cargo run -q -p keel-types --example locale_dump > "$RUNNER_TEMP/keel-locale.tsv"
          node core/crates/keel-types/tools/icu_crosscheck.js "$RUNNER_TEMP/keel-locale.tsv"

      - name: Golden baskets match the Python pricing oracle
        run: |
          python3 core/crates/keel-pricing/tests/golden/generate.py
          git diff --exit-code -- core/crates/keel-pricing/tests/golden/baskets.json

  kotlin:
    name: Kotlin bindings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build keel-ffi, generate the Kotlin, and run its tests against it
        working-directory: bindings/kotlin
        run: gradle test --no-daemon

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: "30.0.16248370"
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain (rust-toolchain.toml) and Android's targets
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install NDK r30 and Android 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      # The wrapper's distribution is pinned by its checksum, which must be Gradle's published one.
      - name: Check the wrapper's pinned checksum against Gradle's
        working-directory: apps/android/gradle/wrapper
        run: |
          url=$(sed -n 's/^distributionUrl=//p' gradle-wrapper.properties | sed 's/\\:/:/')
          pinned=$(sed -n 's/^distributionSha256Sum=//p' gradle-wrapper.properties)
          published=$(curl -fsSL "$url.sha256")
          echo "pinned $pinned, published $published"
          test "$pinned" = "$published"

      # The wrapper's jar is one of Gradle's own, checked against their published checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Run the register's JVM tests, and build the app and its instrumented tests
        working-directory: apps/android
        run: ./gradlew --no-daemon :register:jvmTest :kernel:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      # Every native library, stored 16 KB-aligned in the APK, its segments aligned to 16 KB pages.
      # Found in review: without pipefail, zipalign's failure was grep's success.
      - name: Check the app's native libraries are aligned to 16 KB pages
        working-directory: apps/android
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 -v 4 "$apk" > /tmp/zipalign.txt
          grep -E "lib/.*\.so" /tmp/zipalign.txt
          readelf="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          rm -rf /tmp/apk
          unzip -o -q "$apk" 'lib/*' -d /tmp/apk
          for library in /tmp/apk/lib/*/*.so; do
            echo "$library"
            "$readelf" -lW "$library" | awk '/LOAD/ && $NF != "0x4000" { bad = 1 } END { exit bad }'
          done

  android-emulator:
    name: Android app on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: "30.0.16248370"
    steps:
      - uses: actions/checkout@v5

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the pinned toolchain (rust-toolchain.toml) and the emulator's target
        run: |
          rustup toolchain install
          rustup target add x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install NDK r30 and Android 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # The sync test's location: provisioned on the host, its hub running there, where the
      # emulator reaches the host as 10.0.2.2; the register's kit among the test's assets.
      - name: Provision a location, and run its hub on the host
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p keel-provision -p keel-hub
          location="$RUNNER_TEMP/location"
          target/release/keel-provision "$location" --hub 10.0.2.2:7443 --hub-name hub.keel-cafe.local \
            --device "Back office=1" --device "Front counter" | tee "$RUNNER_TEMP/devices"
          hub=$(awk '/Back office/ { print $1 }' "$RUNNER_TEMP/devices")
          register=$(awk '/Front counter/ { print $1 }' "$RUNNER_TEMP/devices")
          mkdir -p apps/android/app/src/androidTest/assets/kit
          cp "$location/$register"/* apps/android/app/src/androidTest/assets/kit/
          nohup target/release/keel-hub "$location/$hub" > "$RUNNER_TEMP/hub.log" 2>&1 &
          # Listening before the tests begin: a hub that didn't start says so here.
          for _ in $(seq 1 30); do
            grep -q "listening" "$RUNNER_TEMP/hub.log" && break
            sleep 1
          done
          grep "listening" "$RUNNER_TEMP/hub.log"

      # API 30 with 2 GB, like the reference device (ADR-0023).
      - name: Run the instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          working-directory: apps/android
          # On a failure, what the tests and the device said, for the log. Then the kernel's own
          # tests, the golden baskets among them, run on the emulator.
          script: |
            ./gradlew --no-daemon -PkeelAbis=x86_64 :app:connectedDebugAndroidTest || (find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} + ; adb logcat -d '*:E' | tail -300 ; exit 1)
            adb logcat -d -s keel-perf:I | tail -n 5
            ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" ABI=x86_64 ../../tools/android/kernel-tests.sh

      - name: What the hub said
        if: always()
        run: cat "$RUNNER_TEMP/hub.log" || true

      - name: Keep the instrumented tests' reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            apps/android/app/build/reports/androidTests
            apps/android/app/build/outputs/androidTest-results
