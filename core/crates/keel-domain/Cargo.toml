[package]
name = "keel-domain"
version = "0.1.0"
description = "Keel's domain aggregates: event schemas and payload codecs, total fold functions, and command validation, starting with orders."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["os"]
# Operating-system backed clock and entropy, passed through to keel-types and keel-events.
os = ["keel-types/os", "keel-events/os"]

[dependencies]
keel-types.workspace = true
keel-events.workspace = true
keel-pricing.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
