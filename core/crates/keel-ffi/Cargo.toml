[package]
name = "keel-ffi"
version = "0.1.0"
description = "Keel's bindings (ADR-0025): the device runtime as a register object for the platform shells, generated by UniFFI."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The bindgen binary, which writes the Kotlin from the compiled library.
bindgen = ["uniffi/cli"]

[dependencies]
keel-types = { workspace = true, features = ["os"] }
keel-events.workspace = true
keel-domain.workspace = true
keel-store.workspace = true
keel-runtime.workspace = true
keel-doc.workspace = true
keel-print.workspace = true
thiserror.workspace = true
uniffi.workspace = true

[lints]
workspace = true
