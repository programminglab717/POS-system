[package]
name = "keel-hub"
version = "0.1.0"
description = "Keel's Store Hub daemon (ADR-0026), and the loop that joins a device runtime to the local network."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
keel-types = { workspace = true, features = ["os"] }
keel-events.workspace = true
keel-domain.workspace = true
keel-store.workspace = true
keel-runtime.workspace = true
keel-net.workspace = true
keel-sync.workspace = true
keel-provision = { workspace = true, optional = true }

[features]
default = ["daemon"]
# The daemon, which reads a provisioned kit: off for the shells, which take `step` alone and never
# ship the provisioning tool.
daemon = ["dep:keel-provision"]

[[bin]]
name = "keel-hub"
path = "src/main.rs"
required-features = ["daemon"]

[dev-dependencies]
keel-provision.workspace = true

[lints]
workspace = true
