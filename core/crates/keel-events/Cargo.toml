[package]
name = "keel-events"
version = "0.1.0"
description = "Keel's signed, hash-chained event log: canonical CBOR, the event envelope, COSE signatures and chain verification."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["os"]
# Operating-system backed clock and entropy, passed through to keel-types.
os = ["keel-types/os"]

[dependencies]
keel-types.workspace = true
sha2.workspace = true
p256.workspace = true
ecdsa.workspace = true
ed25519-dalek.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
ciborium.workspace = true
num-bigint.workspace = true
sha2.workspace = true

[lints]
workspace = true
